[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tip-calculator"
version = "0.1.0"
description = "A beginner-friendly console app that splits a restaurant bill with a tip."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
tip-calculator = "tip_calculator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

